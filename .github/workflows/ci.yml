name: C++ and Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Assuming pytest is the only Python dependency for tests.
        # If other dependencies are needed, they should be in requirements.txt
        # and installed via 'pip install -r requirements.txt'
        pip install pytest

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential python3-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build

    - name: Run C++ Unit Tests (GoogleTest)
      run: ctest --test-dir build

    - name: Run Python Integration Tests (pytest)
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/build
        pytest tests/integration
